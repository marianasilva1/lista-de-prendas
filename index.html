<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>A Minha Lista de Prendas</title>
<style>
:root { --paper: #2438c9; --mark: #3b50dc; --ribbon: #ffb4c9; --on-ribbon: #4a0f25; --surface: #ffffff; --fg: #171a42; --muted: #565a84; --line: #b9bddf; --error: #b5174f; }
@media (prefers-color-scheme: dark) { :root { --paper: #1a2a9c; --mark: #2839b4; --surface: #1d2044; --fg: #eceefc; --muted: #a6aad0; --line: #4a4e80; --error: #ff8fb1; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: grid; place-items: center; font: 400 1rem/1.5 system-ui, sans-serif; color: var(--fg); background-color: var(--paper);
  background-image: radial-gradient(var(--mark) 22%, transparent 24%), radial-gradient(var(--mark) 11%, transparent 13%); background-size: 56px 56px; background-position: 0 0, 28px 28px;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
form { width: min(100%, 24rem); background: var(--surface); padding: 56px 26px 26px; display: grid; gap: 14px; position: relative;
  clip-path: polygon(34px 0, calc(100% - 34px) 0, 100% 34px, 100% 100%, 0 100%, 0 34px); }
form::before { content: ""; position: absolute; top: 15px; left: 50%; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 0 0 3px var(--ribbon); }
h1 { margin: 0; font-size: 1.625rem; line-height: 1.2; text-wrap: balance; }
p { margin: 0; color: var(--muted); }
label { display: grid; gap: 4px; font-weight: 600; font-size: .875rem; }
input { width: 100%; font: inherit; font-weight: 400; font-size: 1rem; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
button { font: inherit; font-weight: 700; color: var(--on-ribbon); background: var(--ribbon); border: 0; border-radius: 999px; padding: 11px 16px; cursor: pointer; }
button:disabled { opacity: .6; cursor: progress; }
:focus-visible { outline: 3px solid var(--error); outline-offset: 2px; }
#erro { color: var(--error); font-weight: 600; min-height: 1.5em; }
</style>
</head>
<body>
<form id="entrada">
  <h1>A minha lista de prendas</h1>
  <p>Escreve a password que recebeste para veres a lista.</p>
  <label for="password">Password<input id="password" type="password" autocomplete="current-password" required autofocus></label>
  <button id="abrir" type="submit">Abrir a lista</button>
  <p id="erro" role="alert"></p>
</form>

<script>
const cofre = JSON.parse(document.getElementById('cofre').textContent);
const bytes = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
document.getElementById('entrada').addEventListener('submit', async e => {
  e.preventDefault();
  const botao = document.getElementById('abrir'), erro = document.getElementById('erro');
  botao.disabled = true; botao.textContent = 'A abrir…'; erro.textContent = '';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('password').value), 'PBKDF2', false, ['deriveKey']);
    const chave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(cofre.sal), iterations: cofre.iteracoes, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const claro = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(cofre.iv) }, chave, bytes(cofre.dados));
    document.open(); document.write(new TextDecoder().decode(claro)); document.close();
  } catch (_) {
    erro.textContent = 'Password errada. Confirma-a e tenta outra vez.';
    botao.disabled = false; botao.textContent = 'Abrir a lista';
  }
});
</script>
